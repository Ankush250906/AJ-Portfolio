
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Ankush Portfolio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .login-page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(ellipse at top, rgba(124,58,237,.18), transparent 55%),
                var(--bg);
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 36px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: 0 25px 80px rgba(0,0,0,.3);
        }

        .login-card .logo {
            display: inline-block;
            margin-bottom: 25px;
        }

        .login-card h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .login-card .subtitle {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 28px;
        }

        .login-card .form-group {
            margin-bottom: 19px;
        }

        .login-card .button {
            width: 100%;
            margin-top: 5px;
        }

        .login-card .flash-message {
            margin-bottom: 18px;
        }

        .back-home {
            display: block;
            margin-top: 23px;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
        }

        .back-home:hover {
            color: var(--purple);
        }
    </style>
</head>
<body>
    <main class="login-page">
        <section class="login-card">
            <a href="{{ url_for('home') }}" class="logo">Ankush<span>.</span></a>

            <p class="eyebrow">SECURE ADMIN ACCESS</p>
            <h1>Welcome back!</h1>
            <p class="subtitle">Log in to manage your portfolio and client enquiries.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <p class="flash-message {{ category }}">{{ message }}</p>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('admin_login') }}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        id="username"
                        name="username"
                        type="text"
                        placeholder="Enter admin username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="Enter admin password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" class="button primary">Login to Dashboard ↗</button>
            </form>

            <a href="{{ url_for('home') }}" class="back-home">← Back to Portfolio</a>
        </section>
    </main>
</body>
</html>
